<section hlmCard class="h-full">
  <div hlmCardHeader>
    <h3 hlmCardTitle>Crea tu cuenta</h3>
    <p hlmCardDescription>Completa tus datos para empezar a gestionar tus proyectos.</p>
  </div>

  <div hlmCardContent>
    <form id="sign-up-form">
      <div hlmFieldGroup>
        <div hlmField>
          <label hlmFieldLabel for="sign-up-name">Nombre</label>
          <input hlmInput id="sign-up-name" type="text" autocomplete="name" />
        </div>
        <div hlmField>
          <label hlmFieldLabel for="sign-up-email">Correo</label>
          <input hlmInput id="sign-up-email" type="email" autocomplete="email" />
        </div>
        <div hlmField>
          <label hlmFieldLabel for="sign-up-password">Contraseña</label>
          <input hlmInput id="sign-up-password" type="password" autocomplete="new-password" />
          <p hlmFieldDescription>Mínimo 8 caracteres.</p>
        </div>

        <button hlmBtn type="submit" class="w-full">Crear cuenta</button>
      </div>
    </form>
  </div>
</section>
